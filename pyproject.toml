[project]
name = "osc7501"
version = "1.0.2"
description = "Report terminal program status with OSC 7501."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  {name = "Y. Siva Sai Krishna", email = "sivasaikrishnassk@gmail.com"}
]
license = {text = "MIT"}
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Topic :: Terminals",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
keywords = [
  "osc",
  "osc7501",
  "terminal",
  "status",
  "cli",
]
dependencies = []

[dependency-groups]
dev = [
  "pytest",
]

[project.urls]
Homepage = "https://github.com/ysskrishna/osc7501"
Repository = "https://github.com/ysskrishna/osc7501.git"
Issues = "https://github.com/ysskrishna/osc7501/issues"
Changelog = "https://github.com/ysskrishna/osc7501/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osc7501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
